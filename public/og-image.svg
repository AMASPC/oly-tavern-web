<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1"/>
  <text x="600" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#f59e0b" letter-spacing="12" opacity="0.7">OLYMPIA, WA</text>
  <text x="600" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="90" font-weight="900" fill="#f59e0b" letter-spacing="4" filter="url(#textGlow)">THE TOWN TAVERN</text>
  <line x1="480" y1="365" x2="720" y2="365" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <text x="600" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#d6d3d1" font-style="italic" opacity="0.9">Your Neighborhood Living Room.</text>
  <text x="600" y="540" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#78716c" letter-spacing="8" font-weight="700">ABSOLUTELY NO PRETENSE</text>
</svg>
